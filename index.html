<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mi Editorial</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, -apple-system, sans-serif; background: #0b0b12; color: #eee; min-height: 100vh; padding-bottom: 70px; }
  
  /* Header y Pestañas */
  header { padding: 16px 24px 0; position: sticky; top: 0; z-index: 20; background: linear-gradient(180deg, #0b0b12 60%, transparent 100%); }
  .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
  .logo { font-size: 1.5rem; color: #e50914; font-weight: 900; letter-spacing: 1px; }
  .tabs { display: flex; gap: 24px; border-bottom: 1px solid #222; overflow-x: auto; scrollbar-width: none; }
  .tabs::-webkit-scrollbar { display: none; }
  .tab { background: none; border: none; color: #888; font-size: 1rem; font-weight: 600; padding: 10px 0; cursor: pointer; position: relative; white-space: nowrap; }
  .tab.active { color: #fff; }
  .tab.active::after { content: ''; position: absolute; bottom: -1px; left: 0; right: 0; height: 3px; background: #00a8e1; border-radius: 3px 3px 0 0; }

  /* Secciones y Filas */
  .section { display: none; animation: fadeIn 0.4s ease; }
  .section.active { display: block; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

  /* Hero Banner (El primero de la lista) */
  .hero { position: relative; width: 100%; height: 60vh; min-height: 400px; border-radius: 0 0 20px 20px; overflow: hidden; margin-bottom: 20px; }
  .hero img { width: 100%; height: 100%; object-fit: cover; }
  .hero::after { content: ''; position: absolute; inset: 0; background: linear-gradient(0deg, #0b0b12 0%, transparent 60%, rgba(11,11,18,0.4) 100%); }
  .hero-content { position: absolute; bottom: 24px; left: 0; right: 0; text-align: center; z-index: 2; padding: 0 20px; display: flex; flex-direction: column; align-items: center; }
  .hero-title { font-size: 3rem; font-weight: 900; line-height: 1; margin-bottom: 8px; text-shadow: 2px 2px 10px rgba(0,0,0,0.8); text-transform: uppercase; letter-spacing: 2px;}
  .hero-tags { font-size: 0.8rem; color: #ccc; letter-spacing: 2px; margin-bottom: 16px; text-transform: uppercase; }
  .btn-info { background: #fff; color: #000; border: none; padding: 10px 20px; border-radius: 6px; font-size: 0.9rem; font-weight: bold; cursor: pointer; display: flex; align-items: center; gap: 8px; }
  .btn-info:hover { background: #ddd; }
  .hero-actions { display: flex; align-items: center; gap: 20px; margin-top: 16px; color: white; }
  .hero-actions svg { width: 24px; height: 24px; cursor: pointer; }

  /* Carruseles (Filas) */
  .row-container { margin-bottom: 30px; padding: 0 24px; }
  .row-header { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 12px; }
  .row-header h2 { font-size: 1.3rem; font-weight: 600; }
  .row-header span { font-size: 0.85rem; color: #aaa; cursor: pointer; display: flex; align-items: center; gap: 4px; }
  .carousel { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 10px; scroll-snap-type: x mandatory; scrollbar-width: none; }
  .carousel::-webkit-scrollbar { display: none; }
  .card { flex: 0 0 130px; scroll-snap-align: start; border-radius: 8px; overflow: hidden; cursor: pointer; position: relative; background: #222; }
  .card img { width: 100%; aspect-ratio: 2/3; object-fit: cover; display: block; transition: transform 0.3s; }
  .card:hover img { transform: scale(1.05); }
  .card-title { position: absolute; bottom: 0; left: 0; right: 0; padding: 20px 8px 8px; background: linear-gradient(0deg, rgba(0,0,0,0.9), transparent); font-size: 0.85rem; font-weight: 600; text-align: center; }

  /* Lector (Reproductor) */
  #reader { position: fixed; inset: 0; background: #000; z-index: 100; display: none; flex-direction: column; }
  #reader.open { display: flex; }
  #reader .topbar { padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; background: #111; border-bottom: 1px solid #222; }
  #reader .topbar h2 { font-size: 1rem; }
  #reader .topbar button { background: #e50914; color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: bold;}
  #reader .pages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; align-items: center; gap: 16px; }
  #reader .pages img { max-width: 100%; border-radius: 6px; background: #111; min-height: 200px; }
  .msg { color: #888; padding: 40px; text-align: center; grid-column: 1 / -1; }
</style>
</head>
<body>

<header>
  <div class="top-bar">
    <div class="logo">Mi Editorial</div>
    <button onclick="loadCatalog()" style="background:#222;color:#fff;border:none;padding:8px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"/><path d="M16 21v-5h5"/></svg>
    </button>
  </div>
  <div class="tabs" id="tabsContainer">
    <!-- Las pestañas se generan dinámicamente aquí -->
  </div>
</header>

<main id="mainContent">
  <!-- Los contenidos se generan dinámicamente aquí -->
  <div id="loadingMsg" class="msg">Cargando catálogo...</div>
</main>

<!-- Lector de páginas -->
<div id="reader">
  <div class="topbar">
    <h2 id="readerTitle">—</h2>
    <button id="btnClose">Cerrar ✕</button>
  </div>
  <div class="pages" id="pages"></div>
</div>

<script>
const CATALOG_URL = 'comics.json'; // Asegúrate que tu archivo se llame exactamente así (minúscula)

/* Funciones auxiliares para tolerar variaciones en el JSON */
function getTitle(c) { return c.titulo || c.title || c.nombre || 'Sin título'; }
function getNumber(c) { return c.numero || c.number || c.issue || ''; }
function getSynopsis(c) { return c.sinopsis || c.synopsis || c.description || ''; }
function getCover(c) { return c.portada || c.cover || c.thumbnail || c.imagen || ''; }
function getPages(c) { return c.paginas || c.pages || c.paginasUrls || c.images || []; }
function getType(c) { return (c.tipo || c.type || 'comic').toLowerCase(); }

/* Variable global */
let catalogData = [];

async function loadCatalog() {
  const main = document.getElementById('mainContent');
  const tabsContainer = document.getElementById('tabsContainer');
  main.innerHTML = '<div class="msg">Cargando catálogo...</div>';
  tabsContainer.innerHTML = '';

  try {
    const res = await fetch(CATALOG_URL + '?v=' + Date.now());
    if (!res.ok) throw new Error('Error HTTP ' + res.status + '. ¿Existe el archivo ' + CATALOG_URL + '?');
    
    const raw = await res.json();
    catalogData = Array.isArray(raw) ? raw : [raw];
    
    if (catalogData.length === 0) {
      main.innerHTML = '<div class="msg">No hay contenido en el catálogo aún.</div>';
      return;
    }

    renderApp();

  } catch (e) {
    main.innerHTML = `<div class="msg">⚠️ Error: ${e.message}<br><br>Revisa que el archivo se llame igual y que sea un JSON válido.</div>`;
  }
}

function renderApp() {
  const main = document.getElementById('mainContent');
  const tabsContainer = document.getElementById('tabsContainer');
  main.innerHTML = '';

  // 1. Agrupar por tipo y detectar cuáles existen
  const tipos = { comic: [], animacion: [], pelicula: [] };
  
  catalogData.forEach(item => {
    const t = getType(item);
    if (tipos[t]) {
      tipos[t].push(item);
    } else {
      tipos.comic.push(item); // Si tiene un tipo desconocido, va a comics por defecto
    }
  });

  // 2. Crear pestañas solo para los tipos que tienen contenido
  const nombresPestañas = { comic: 'CÓMICS', animacion: 'ANIMACIONES', pelicula: 'PELÍCULAS' };
  let firstActive = true;

  Object.keys(tipos).forEach(tipo => {
    if (tipos[tipo].length > 0) {
      // Crear botón de pestaña
      const btn = document.createElement('button');
      btn.className = 'tab' + (firstActive ? ' active' : '');
      btn.textContent = nombresPestañas[tipo];
      btn.onclick = () => switchTab(tipo, btn);
      tabsContainer.appendChild(btn);

      // Crear sección contenedora
      const section = document.createElement('div');
      section.className = 'section' + (firstActive ? ' active' : '');
      section.id = 'section-' + tipo;
      
      // Renderizar contenido de la sección
      renderSection(section, tipos[tipo]);

      main.appendChild(section);
      firstActive = false; // Solo la primera pestaña será la activa al cargar
    }
  });
}

function switchTab(tipo, btnElement) {
  // Apagar todas las pestañas y secciones
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
  
  // Encender la seleccionada
  btnElement.classList.add('active');
  document.getElementById('section-' + tipo).classList.add('active');
  window.scrollTo(0, 0); // Subir al inicio al cambiar de pestaña
}

function renderSection(container, items) {
  // 1. El primer elemento de la lista va al "Hero Banner" (Diseño grande)
  const heroItem = items[0];
  const heroDiv = document.createElement('div');
  heroDiv.className = 'hero';
  heroDiv.innerHTML = `
    <img src="${getCover(heroItem)}" alt="${getTitle(heroItem)}">
    <div class="hero-content">
      <div class="hero-title">${getTitle(heroItem)}</div>
      <div class="hero-tags">${getNumber(heroItem) ? '#' + getNumber(heroItem) + ' • ' : ''} NUEVO ESTRENO</div>
      <button class="btn-info" onclick='openReader(${JSON.stringify(heroItem).replace(/'/g, "&#39;")})'>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/></svg>
        INFORMACIÓN
      </button>
      <div class="hero-actions">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><polyline points="16 6 12 2 8 6"/><line x1="12" y1="2" x2="12" y2="15"/></svg>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg>
      </div>
    </div>
  `;
  // Hacer clicable todo el banner (excepto el botón que ya tiene su evento)
  heroDiv.addEventListener('click', (e) => {
    if(e.target.tagName !== 'BUTTON' && e.target.tagName !== 'svg' && e.target.tagName !== 'path') {
      openReader(heroItem);
    }
  });
  container.appendChild(heroDiv);

  // 2. El resto de elementos van a un carrusel horizontal (si hay más de 1)
  if (items.length > 1) {
    const restItems = items.slice(1);
    
    // Contenedor de fila "Recientes"
    const rowDiv = document.createElement('div');
    rowDiv.className = 'row-container';
    rowDiv.innerHTML = `
      <div class="row-header">
        <h2>Recientes</h2>
        <span>ver más +</span>
      </div>
      <div class="carousel" id="carousel-items"></div>
    `;
    const carousel = rowDiv.querySelector('#carousel-items');

    restItems.forEach(item => {
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `
        <img src="${getCover(item)}" alt="${getTitle(item)}" loading="lazy">
        <div class="card-title">${getTitle(item)}</div>
      `;
      card.onclick = () => openReader(item);
      carousel.appendChild(card);
    });

    container.appendChild(rowDiv);
  }
}

/* Lector Modal */
function openReader(comic) {
  const reader = document.getElementById('reader');
  const title = document.getElementById('readerTitle');
  const pages = document.getElementById('pages');

  reader.classList.add('open');
  title.textContent = getTitle(comic) + (getNumber(comic) ? ' #' + getNumber(comic) : '');
  pages.innerHTML = '<div class="msg">Cargando páginas...</div>';

  setTimeout(() => {
    pages.innerHTML = '';
    const lista = getPages(comic);
    if (!lista || lista.length === 0) {
      pages.innerHTML = '<div class="msg">No hay páginas disponibles.</div>';
      return;
    }
    lista.forEach((url, i) => {
      const img = document.createElement('img');
      img.src = url;
      img.alt = 'Página ' + (i + 1);
      img.loading = 'lazy';
      pages.appendChild(img);
    });
  }, 300);
}

document.getElementById('btnClose').addEventListener('click', () => {
  document.getElementById('reader').classList.remove('open');
});

/* Iniciar App */
loadCatalog();
</script>
</body>
</html>
